# Publishes the repository as-is to GitHub Pages (Settings → Pages → Source:
# "GitHub Actions"). Nothing is generated at deploy time and no secret is
# read: until Stage L2a (2026-10-13) a step here wrote DASHBOARD_READ_TOKEN
# into a public dashboard-config.js; dashboard_kpis_barberia.html now uses
# the panel login instead, and that file is no longer published.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
