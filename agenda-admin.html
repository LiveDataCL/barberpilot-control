<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Agenda · Salon Men Saúl Fino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEBE6;--surface:#FFFFFF;--surface2:#F5F3EF;
  --border:#DDD9D4;--text:#1A1916;--text2:#5C5A54;--text3:#9A9891;
  --soft:#E4E1DC;--gold:#C9A84C;--gold-lt:rgba(201,168,76,.12);
  --ok:#16A34A;--warn:#CA8A04;--err:#DC2626;
  --b1:#7C3AED;--b2:#0369A1;--b3:#059669;--b4:#B45309;
  --slot-h:68px;--time-w:54px;--r:8px;--rl:14px;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'SF Mono','Cascadia Code','Consolas',monospace;
  --sh1:0 1px 4px rgba(0,0,0,.07);
  --sh2:0 4px 16px rgba(0,0,0,.09),0 2px 4px rgba(0,0,0,.04);
  --sh3:0 20px 60px rgba(0,0,0,.14),0 8px 24px rgba(0,0,0,.07);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;overflow-x:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,select,input{font-family:var(--sans)}
button{cursor:pointer}

/* ── HEADER ── */
.hdr{background:var(--text);color:#fff;padding:0 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:200;height:58px;flex-shrink:0}
.hdr-brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.hdr-logo{width:34px;height:34px;background:linear-gradient(135deg,var(--gold),#e8c96e);color:var(--text);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex-shrink:0;letter-spacing:.04em;box-shadow:0 2px 8px rgba(201,168,76,.3)}
.hdr-title{font-size:14px;font-weight:700;letter-spacing:-.01em}
.hdr-sub{font-size:10px;opacity:.4;letter-spacing:.03em}
.hdr-center{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
.date-nav{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.08);border-radius:11px;padding:3px}
.dnav-btn{width:28px;height:28px;border-radius:8px;background:transparent;border:none;color:rgba(255,255,255,.65);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s;flex-shrink:0}
.dnav-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.date-lbl{font-size:13px;font-weight:700;min-width:180px;text-align:center;letter-spacing:-.01em;white-space:nowrap;padding:0 6px}
.btn-today{font-size:11px;font-weight:700;padding:5px 12px;background:rgba(201,168,76,.18);border:1px solid rgba(201,168,76,.4);border-radius:20px;color:#c9a84c;cursor:pointer;white-space:nowrap;letter-spacing:.04em;transition:all .12s;flex-shrink:0}
.btn-today:hover{background:rgba(201,168,76,.32);border-color:rgba(201,168,76,.6)}
.view-toggle{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:11px;padding:3px;flex-shrink:0}
.view-btn{padding:5px 14px;border-radius:8px;background:none;border:none;color:rgba(255,255,255,.45);font-size:11px;font-weight:700;letter-spacing:.06em;cursor:pointer;transition:all .15s;white-space:nowrap}
.view-btn.on{background:rgba(255,255,255,.13);color:#fff}
.hdr-right{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-left:auto}
.hdr-link{font-size:11px;font-weight:600;padding:5px 12px;letter-spacing:.04em;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:rgba(255,255,255,.7);text-decoration:none;transition:all .12s;white-space:nowrap}
.hdr-link:hover{color:#fff;border-color:rgba(255,255,255,.45)}
.refresh-lbl{font-size:10px;opacity:.4;white-space:nowrap}
.refresh-lbl.fetching{animation:blink .9s infinite}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:.85}}

/* ── FILTER PILLS ── */
.pills-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.pills-bar::-webkit-scrollbar{display:none}
.pill{padding:6px 16px;border:1.5px solid var(--border);border-radius:20px;background:var(--surface);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;color:var(--text2);user-select:none;letter-spacing:.01em}
.pill:hover{border-color:var(--text);color:var(--text)}
.pill.on{background:var(--text);border-color:var(--text);color:#fff}
.pill[data-bid=b1].on{background:var(--b1);border-color:var(--b1)}
.pill[data-bid=b2].on{background:var(--b2);border-color:var(--b2)}
.pill[data-bid=b3].on{background:var(--b3);border-color:var(--b3)}
.pill[data-bid=b4].on{background:var(--b4);border-color:var(--b4)}

/* ── KPI BAR ── */
.sum-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.sum-bar::-webkit-scrollbar{display:none}
.kpi{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rl);padding:11px 16px;min-width:130px;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
.kpi-lbl{font-size:10px;color:var(--text3);letter-spacing:.08em;font-weight:600;text-transform:uppercase}
.kpi-val{font-size:24px;font-weight:800;letter-spacing:-.04em;line-height:1}
.kpi-val.c-ok{color:var(--ok)}.kpi-val.c-warn{color:var(--warn)}.kpi-val.c-gold{color:var(--gold)}

/* ── MOBILE BARBER NAV ── */
.mob-nav{display:none;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.mob-nav-btn{padding:7px 16px;background:var(--soft);border:1px solid var(--border);border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;color:var(--text)}
.mob-barber-nm{font-weight:800;font-size:14px}

/* ── CALENDAR ── */
.cal-outer{flex:1;overflow:auto;position:relative}
.cal-inner{padding:16px;min-width:max-content}

/* Daily layout */
.cal-daily{display:flex}
.time-col{width:var(--time-w);flex-shrink:0;padding-top:52px}
.tslot-lbl{height:var(--slot-h);display:flex;align-items:flex-start;padding-right:10px;justify-content:flex-end;font-size:10px;font-family:var(--mono);color:var(--text3);font-weight:500;border-right:1px solid var(--border)}
.barber-cols{display:flex;flex:1}
.b-col{flex:1;min-width:185px;border-right:1px solid var(--border)}
.b-col:last-child{border-right:none}
.b-col-hdr{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;gap:10px;height:52px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.b-av{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.b-av.b1{background:var(--b1)}.b-av.b2{background:var(--b2)}.b-av.b3{background:var(--b3)}.b-av.b4{background:var(--b4)}
.b-nm{font-size:13px;font-weight:700;letter-spacing:-.01em}
.b-cnt{font-size:10px;color:var(--text3);font-weight:500}
.b-col-body{position:relative}

/* Slot rows — z-index:1 so overlays/cards can be above */
.srow{position:absolute;left:0;right:0;height:var(--slot-h);border-bottom:1px dashed rgba(0,0,0,.06);cursor:pointer;transition:background .1s;z-index:1}
.srow:hover{background:var(--gold-lt)}
.srow.hr-bound{border-bottom-color:var(--border);border-bottom-style:solid}
.srow.occupied{cursor:default;pointer-events:none}
.srow.occupied:hover{background:none}

/* Current-time indicator */
.now-line{position:absolute;left:0;right:0;z-index:5;pointer-events:none;display:flex;align-items:center}
.now-dot{width:9px;height:9px;border-radius:50%;background:#ef4444;flex-shrink:0;margin-left:-1px;box-shadow:0 0 0 3px rgba(239,68,68,.2)}
.now-bar{flex:1;height:2px;background:rgba(239,68,68,.5)}

/* Block overlays — z-index:2 */
.blk-overlay{position:absolute;left:5px;right:5px;z-index:2;background:repeating-linear-gradient(45deg,#fff1f2,#fff1f2 8px,#fecdd3 8px,#fecdd3 16px);border-radius:var(--r);border-left:3px solid var(--err);padding:5px 8px;overflow:hidden;pointer-events:none}
.blk-lbl{font-size:11px;font-weight:700;color:#9f1239;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Service block — clickable, z-index:2 */
.blk-overlay.servicio{
  background:linear-gradient(135deg,#f5f3ff 0%,#ede9fe 100%);
  border-left-color:var(--b1);pointer-events:all;cursor:pointer;
  box-shadow:0 2px 8px rgba(124,58,237,.14);
  transition:all .18s cubic-bezier(.34,1.4,.64,1);
}
.blk-overlay.servicio:hover{
  background:linear-gradient(135deg,#ede9fe 0%,#ddd6fe 100%);
  box-shadow:0 6px 18px rgba(124,58,237,.22);
  transform:translateY(-2px);
}
.blk-svc-row{display:flex;align-items:flex-start;justify-content:space-between;gap:4px}
.blk-overlay.servicio .blk-lbl{color:#5b21b6}
.blk-sub{font-size:10px;color:#7c3aed;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;font-weight:500}
.blk-time-lbl{font-size:9px;color:#7c3aed;opacity:.5;margin-top:2px;font-family:var(--mono)}
.blk-edit-btn{
  width:20px;height:20px;border-radius:6px;background:rgba(124,58,237,.12);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-size:10px;color:var(--b1);opacity:0;transition:opacity .15s;
}
.blk-overlay.servicio:hover .blk-edit-btn{opacity:1}

/* Appointment cards — z-index:3 */
.apt-card{position:absolute;left:5px;right:5px;border-radius:var(--r);padding:6px 9px;cursor:pointer;overflow:hidden;border-left:3px solid transparent;transition:all .15s;z-index:3;box-shadow:var(--sh1)}
.apt-card:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.apt-card.pendiente{background:#fffbeb;border-left-color:var(--warn);color:#78350f}
.apt-card.confirmado{background:#f0fdf4;border-left-color:var(--ok);color:#14532d}
.apt-card.cancelado{background:#fef2f2;border-left-color:var(--err);color:#7f1d1d;opacity:.55}
.apt-card.completado{background:#f9fafb;border-left-color:#9CA3AF;color:#4B5563;opacity:.7}
.apt-card.en_curso{background:#f0fdf4;border-left-color:var(--ok);color:#14532d;box-shadow:0 0 0 2px rgba(22,163,74,.18),var(--sh1);animation:aptPulse 2s infinite}
@keyframes aptPulse{0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,.18),var(--sh1)}50%{box-shadow:0 0 0 5px rgba(22,163,74,.06),var(--sh1)}}
.apt-nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.apt-svc{font-size:10px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;font-weight:500}
.apt-hr{font-size:10px;font-family:var(--mono);opacity:.5;margin-top:1px;font-weight:500}

/* Tipo-toggle (segmented control) */
.tipo-seg{display:flex;gap:3px;background:var(--surface2);border-radius:10px;padding:3px;margin-bottom:16px;border:1px solid var(--border)}
.tipo-pill{flex:1;padding:8px 12px;border-radius:8px;border:none;background:transparent;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);transition:all .15s;font-family:var(--sans)}
.tipo-pill.active{background:var(--surface);color:var(--text);box-shadow:var(--sh1)}

/* Skeleton */
.skel{background:linear-gradient(90deg,var(--soft) 0%,var(--bg) 50%,var(--soft) 100%);background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:var(--r);height:48px;margin:4px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Closed banner */
.closed-msg{padding:100px 20px;text-align:center;color:var(--text3)}
.closed-ico{font-size:44px;margin-bottom:14px}
.closed-txt{font-size:18px;font-weight:700;letter-spacing:-.02em}

/* ── WEEKLY VIEW ── */
.wk-wrap{overflow-x:auto;padding:16px}
.wk-table{width:100%;border-collapse:collapse;border-radius:var(--rl);overflow:hidden}
.wk-th{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);padding:12px;text-align:center;border-bottom:1px solid var(--border);border-right:1px solid var(--border);background:var(--surface);white-space:nowrap;vertical-align:bottom}
.wk-th.today{color:var(--gold);background:#fffbeb}
.wk-blbl{font-size:13px;font-weight:700;padding:12px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);background:var(--surface2);white-space:nowrap;vertical-align:middle}
.wk-cell{padding:12px 8px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);text-align:center;cursor:pointer;transition:background .12s;min-width:110px;vertical-align:middle;background:var(--surface)}
.wk-cell:hover{background:var(--soft)}
.wk-cell:last-child{border-right:none}
.wk-cell.closed{background:var(--surface2);cursor:default;color:var(--text3)}
.wk-cell.today{background:#fffbeb}
.wk-load-bar{height:3px;border-radius:99px;background:var(--border);margin:0 auto 7px;max-width:48px;overflow:hidden}
.wk-load-fill{height:100%;border-radius:99px;transition:width .3s}
.wk-load-fill.none{background:var(--border);width:0%}
.wk-load-fill.light{background:var(--ok);width:33%}
.wk-load-fill.med{background:var(--warn);width:66%}
.wk-load-fill.heavy{background:var(--err);width:100%}
.wk-n{font-size:24px;font-weight:800;letter-spacing:-.04em;display:block;line-height:1}
.wk-rev{font-size:11px;color:var(--text3);font-weight:500;margin-top:3px}

/* ── MODALS ── */
.ov{display:none;position:fixed;inset:0;background:rgba(15,14,12,.5);z-index:600;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.ov.on{display:flex}
@media(min-width:600px){.ov{align-items:center}}
.modal{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;box-shadow:var(--sh3)}
@media(min-width:600px){.modal{border-radius:var(--rl);animation:popUp .22s cubic-bezier(.34,1.2,.64,1)}}
@keyframes popUp{from{transform:scale(.96) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.m-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 0}
@media(min-width:600px){.m-handle{display:none}}
.m-hdr{padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.m-title{font-size:16px;font-weight:800;letter-spacing:-.02em}
.m-close{width:32px;height:32px;border-radius:10px;background:var(--soft);border:none;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:background .12s}
.m-close:hover{background:var(--border)}
.m-body{padding:18px 20px}
.m-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);gap:12px}
.mrow:last-child{border-bottom:none}
.mlbl{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--text3);text-transform:uppercase;flex-shrink:0}
.mval{font-size:13px;font-weight:600}

/* Buttons */
.btn{padding:10px 18px;border-radius:10px;font-size:12px;font-weight:700;letter-spacing:.04em;border:none;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover:not(:disabled){filter:brightness(.92);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:none}
.btn:disabled{opacity:.3;cursor:not-allowed}
.b-ok{background:var(--ok);color:#fff;box-shadow:0 2px 8px rgba(22,163,74,.22)}
.b-err{background:var(--err);color:#fff;box-shadow:0 2px 8px rgba(220,38,38,.18)}
.b-dk{background:var(--text);color:#fff;box-shadow:var(--sh1)}
.b-ghost{background:var(--soft);color:var(--text);border:1px solid var(--border)}
.b-wa{background:#25D366;color:#fff;box-shadow:0 2px 8px rgba(37,211,102,.22);display:flex;align-items:center;gap:5px}
.b-purple{background:var(--b1);color:#fff;box-shadow:0 2px 8px rgba(124,58,237,.22)}

/* Status badge */
.ebadge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.02em}
.ebadge.pendiente{background:#fffbeb;color:#92400e}
.ebadge.confirmado{background:#f0fdf4;color:#14532d}
.ebadge.cancelado{background:#fef2f2;color:#7f1d1d}
.ebadge.completado{background:#f9fafb;color:#374151}
.ebadge.en_curso{background:#f0fdf4;color:#14532d}

/* Forms */
.fg{margin-bottom:14px}
.fg:last-child{margin-bottom:0}
.flbl{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.finp,.fsel{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--r);font-size:13px;background:var(--surface);color:var(--text);outline:none;transition:border-color .12s;font-family:var(--sans)}
.finp:focus,.fsel:focus{border-color:var(--text)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fck{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin-top:10px;font-weight:500}
.fck input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--text)}

/* Barber pick */
.bpick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.bpick-btn{padding:14px 8px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--surface2);cursor:pointer;font-size:12px;font-weight:700;text-align:center;transition:all .12s}
.bpick-btn:hover{border-color:var(--text);background:var(--soft)}
.bpick-btn.on{background:var(--text);color:#fff;border-color:var(--text)}

/* Check-in arrival banner */
.checkin-banner{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1.5px solid #86efac;border-radius:var(--r);padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.checkin-banner-info{}
.checkin-banner-ttl{font-size:13px;font-weight:700;color:#14532d;letter-spacing:-.01em}
.checkin-banner-sub{font-size:11px;color:#16a34a;margin-top:2px;font-weight:500}
.btn-checkin{background:#16a34a;color:#fff;border-radius:10px;padding:11px 20px;font-size:12px;font-weight:800;letter-spacing:.04em;border:none;cursor:pointer;white-space:nowrap;box-shadow:0 2px 8px rgba(22,163,74,.28);transition:all .15s;flex-shrink:0}
.btn-checkin:hover:not(:disabled){background:#15803d;transform:translateY(-1px);box-shadow:0 4px 14px rgba(22,163,74,.36)}
.btn-checkin:disabled{opacity:.55;cursor:not-allowed;transform:none}

/* Toast */
.toast{position:fixed;bottom:24px;right:20px;background:var(--text);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transform:translateY(10px);transition:all .22s cubic-bezier(.34,1.5,.64,1);pointer-events:none;max-width:300px;box-shadow:var(--sh3)}
.toast.on{opacity:1;transform:none}
.toast.t-ok{background:#14532d}
.toast.t-err{background:#7f1d1d}

/* Mobile */
@media(max-width:767px){
  .hdr{height:auto;flex-wrap:wrap;padding:10px 14px;gap:6px}
  .hdr-center{order:3;width:100%;justify-content:space-between}
  .date-lbl{font-size:12px;min-width:0}
  .mob-nav{display:flex}
  .b-col{min-width:calc(100vw - 54px - 20px) !important}
  .hdr-right{display:none}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-brand">
    <div class="hdr-logo">SF</div>
    <div>
      <div class="hdr-title">Panel de Agenda</div>
      <div class="hdr-sub">Salon Men Saúl Fino</div>
    </div>
  </div>
  <div class="hdr-center">
    <div class="date-nav">
      <button class="dnav-btn" onclick="shiftDate(-1)">&#8592;</button>
      <div class="date-lbl" id="dateLbl"></div>
      <button class="dnav-btn" onclick="shiftDate(1)">&#8594;</button>
    </div>
    <button class="btn-today" onclick="goToday()">Hoy</button>
    <div class="view-toggle">

<div class="toast" id="toast"></div>

<script>
'use strict';

const API = 'https://barberpilot-api-production.up.railway.app';

// ── Embedded mode (inside index.html iframe) ──────────────────
const IS_EMBEDDED = new URLSearchParams(location.search).get('embedded') === '1' || window.parent !== window;
if (IS_EMBEDDED) {
  const lnk = document.getElementById('lnkSistema');
  const btn = document.getElementById('btnVerCola');
  if (lnk) lnk.style.display = 'none';
  if (btn) btn.style.display = '';
}
function irACola() {
  try {
    if (window.parent !== window) {
      window.parent.postMessage({ bp_action: 'showTab', id: 'pSala' }, '*');
      return;
    }
  } catch(e) {}
  window.location.href = 'index.html';
}
const SLOT_H = 68, SLOT_M = 30;

let BARBERS = [
  {id:'b1',name:'Didian'},{id:'b2',name:'Emerson'},
  {id:'b5',name:'Steven'},{id:'b6',name:'Winder'},
];
let B_MAP    = {b1:'Didian',b2:'Emerson',b5:'Steven',b6:'Winder'};
let BID_TO_QID = {b1:'didian',b2:'emerson',b5:'steven',b6:'winder'};
function renderPills(){
  var pb=document.getElementById('pillsBar'); if(!pb) return;
  pb.innerHTML='<span class="pill on" data-bid="todos" onclick="setFilter(\'todos\')">Todos</span>'
    +BARBERS.map(function(b){
      return '<span class="pill" data-bid="'+b.id+'" onclick="setFilter(\''+b.id+'\')">'+b.name+'</span>';
    }).join('');
  pb.querySelectorAll('.pill').forEach(function(p){p.classList.toggle('on',p.dataset.bid===filter);});
}
function cargarBarberos(){
  fetch('https://barberpilot-api-production.up.railway.app/config/negocio/publico?tenant=saulfino')
    .then(function(r){return r.json();})
    .then(function(json){
      if(!json.ok) return;
      if(Array.isArray(json.barberos)&&json.barberos.length){
        BARBERS=json.barberos.map(function(b){return{id:b.bid,name:b.nombre};});
        B_MAP={}; BID_TO_QID={};
        json.barberos.forEach(function(b){B_MAP[b.bid]=b.nombre;BID_TO_QID[b.bid]=b.queue_id;});
        renderPills();
      }
    }).catch(function(){});
}
cargarBarberos();
const SCHED = {
  1:{o:'10:00',c:'20:00'},2:{o:'10:00',c:'20:00'},3:{o:'10:00',c:'20:00'},
  4:{o:'10:00',c:'20:00'},5:{o:'10:00',c:'20:00'},6:{o:'10:00',c:'15:00'},0:null
};
const DAYS  = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MONS  = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DSHORT= ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

// ── State ─────────────────────────────────────────────────────
let cur       = new Date();
let view      = 'dia';
let filter    = 'todos';
let apts      = [];
let blocked   = [];
let weekData  = {};
let mbIdx     = 0;
let selApt    = null;
let rasId     = null;
let rasNewBid = null;
let lastFetch = null;
let autoTimer = null;
let fetching  = false;
let nowTimer  = null;

// ── Utils ─────────────────────────────────────────────────────
const toMin  = t => { const [h,m]=(t||'0:0').split(':').map(Number); return h*60+m; };
const fromMin= m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const fmtD   = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addD   = (d,n) => { const r=new Date(d); r.setDate(r.getDate()+n); return r; };
const peso   = n => '$'+Number(n||0).toLocaleString('es-CL');
const sched  = d => SCHED[d.getDay()]||null;
const ds     = ()  => fmtD(cur);

function weekStart(d) {
  const r=new Date(d), dow=r.getDay();
  r.setDate(r.getDate()+(dow===0?-6:1-dow));
  return r;
}

// ── Toast ─────────────────────────────────────────────────────
let tTimer;
function showToast(msg, type='', dur=3000) {
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.className='toast on'+(type?' t-'+type:'');
  clearTimeout(tTimer);
  tTimer=setTimeout(()=>el.classList.remove('on'),dur);
}

// ── Header ────────────────────────────────────────────────────
function updateHdr() {
  const d=cur;
  document.getElementById('dateLbl').textContent=
    `${DAYS[d.getDay()]} ${d.getDate()} de ${MONS[d.getMonth()]} ${d.getFullYear()}`;
}
function updateRefLbl() {
  const el=document.getElementById('refLbl');
  if (fetching){ el.textContent='Actualizando…'; el.className='refresh-lbl fetching'; return; }
  if (!lastFetch){ el.textContent=''; return; }
  el.className='refresh-lbl';
  const sec=Math.round((Date.now()-lastFetch.getTime())/1000);
  el.textContent = sec<5?'Actualizado ahora':`Actualizado hace ${sec}s`;
}
setInterval(updateRefLbl,5000);

// ── Navigation ────────────────────────────────────────────────
function shiftDate(n) {
  cur=addD(cur, view==='semana' ? n*7 : n);
  updateHdr(); refresh();
}
function goToday() { cur=new Date(); updateHdr(); refresh(); }
function setView(v) {
  view=v;
  document.getElementById('vbDia').classList.toggle('on',v==='dia');
  document.getElementById('vbSemana').classList.toggle('on',v==='semana');
  refresh();
}
function setFilter(bid) {
  filter=bid; mbIdx=0;
  document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('on',p.dataset.bid===bid));
  renderView();
}

// ── Fetch ─────────────────────────────────────────────────────
async function fetchDay(dateStr) {
  const r=await fetch(`${API}/appointments?fecha=${dateStr}`);
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  const j=await r.json();
  return Array.isArray(j)?j:(j.appointments||j.data||[]);
}
async function fetchBlocked(dateStr) {
  try {
    const r=await fetch(`${API}/blocked-slots?fecha=${dateStr}`);
    if(!r.ok) return [];
    const j=await r.json();
    return Array.isArray(j)?j:(j.blocked_slots||j.data||[]);
  } catch{ return []; }
}

async function refresh() {
  clearTimeout(autoTimer);
  fetching=true; updateRefLbl();
  try {
    if(view==='dia') {
      const [a,b]=await Promise.all([fetchDay(ds()),fetchBlocked(ds())]);
      apts=a; blocked=b;
    } else {
      const ws=weekStart(cur);
      weekData={};
      await Promise.all(Array.from({length:6},(_,i)=>addD(ws,i)).map(async d=>{
        const k=fmtD(d);
        const [a,b]=await Promise.all([fetchDay(k),fetchBlocked(k)]);
        weekData[k]={a,b};
      }));
    }
    lastFetch=new Date();
    fetching=false; updateRefLbl();
    renderView();
  } catch(e) {
    fetching=false; updateRefLbl();
    showToast('Error al cargar — reintentando...','err');
    autoTimer=setTimeout(refresh,10000);
    return;
  }
  autoTimer=setTimeout(refresh,20000);
}

// ── Summary ───────────────────────────────────────────────────
function updateSum(list) {
  const conf=list.filter(a=>a.estado==='confirmado').length;
  const pend=list.filter(a=>a.estado==='pendiente').length;
  const fact=list.filter(a=>a.estado==='confirmado').reduce((s,a)=>s+(a.precio_base||a.precio||0),0);
  const byCnt={}; BARBERS.forEach(b=>byCnt[b.id]=0);
  list.filter(a=>a.estado!=='cancelado').forEach(a=>{if(byCnt[a.bid]!=null)byCnt[a.bid]++;});
  const top=Object.entries(byCnt).sort((x,y)=>y[1]-x[1])[0];
  document.getElementById('kpiConf').textContent=conf;
  document.getElementById('kpiPend').textContent=pend;
  document.getElementById('kpiFact').textContent=fact?peso(fact):'$0';
  document.getElementById('kpiBusy').textContent=(top&&top[1]>0)?`${B_MAP[top[0]]} (${top[1]})`:'—';
}

// ── Render dispatcher ─────────────────────────────────────────
function renderView() {
  if(view==='dia') renderDay(); else renderWeek();
}

// ── DAILY VIEW ────────────────────────────────────────────────
function renderDay() {
  _svcBlkMap = {}; // reset lookup on each render
  updateSum(apts);
  const sc=sched(cur);
  if(!sc) {
    document.getElementById('calContent').innerHTML=`<div class="closed-msg"><div class="closed-ico">🔒</div><div class="closed-txt">Cerrado — Domingo</div></div>`;
    document.getElementById('mobNav').style.display='none';
    return;
  }
  const openM=toMin(sc.o), closeM=toMin(sc.c);
  const rows=(closeM-openM)/SLOT_M;
  const totalPx=rows*SLOT_H;
  const visBs=filter==='todos'?BARBERS:BARBERS.filter(b=>b.id===filter);
  const isMob=window.innerWidth<768;

  // Current-time position (only if today)
  const todayStr=fmtD(new Date());
  const isToday=ds()===todayStr;
  const nowM=isToday?(new Date().getHours()*60+new Date().getMinutes()):null;
  const nowPx=(nowM!==null&&nowM>=openM&&nowM<=closeM)?Math.round(((nowM-openM)/SLOT_M)*SLOT_H):null;

  // Mobile nav
  const mn=document.getElementById('mobNav');
  if(isMob&&filter==='todos') {
    mn.style.display='flex';
    mbIdx=Math.min(mbIdx,visBs.length-1);
    document.getElementById('mbNm').textContent=visBs[mbIdx]?.name||'';
  } else { mn.style.display='none'; }

  // Time labels
  let tHtml='<div class="time-col">';
  for(let s=0;s<rows;s++) {
    const t=fromMin(openM+s*SLOT_M);
    tHtml+=`<div class="tslot-lbl">${t.endsWith(':00')?t:''}</div>`;
  }
  tHtml+='</div>';

  // Barber columns
  let cHtml='<div class="barber-cols" id="bCols">';
  visBs.forEach((b,bi) => {
    const hidden=isMob&&filter==='todos'&&bi!==mbIdx;
    const dayApts=apts.filter(a=>a.bid===b.id);
    const dayBlk =blocked.filter(bl=>!bl.bid||bl.bid===b.id);
    const active =dayApts.filter(a=>a.estado!=='cancelado');

    // Mark occupied minute slots
    const occ=new Set();
    active.forEach(a=>{
      const sm=toMin((a.hora_inicio||a.hora||'00:00').slice(0,5));
      const em=toMin((a.hora_fin||fromMin(sm+(a.duracion||30))).slice(0,5));
      for(let m=sm;m<em;m+=SLOT_M) occ.add(m);
    });
    dayBlk.forEach(bl=>{
      if(!bl.hora_inicio){for(let m=openM;m<closeM;m+=SLOT_M)occ.add(m);}
      else{const sm=toMin(bl.hora_inicio.slice(0,5)),em=toMin(bl.hora_fin.slice(0,5));for(let m=sm;m<em;m+=SLOT_M)occ.add(m);}
    });

    cHtml+=`<div class="b-col" style="${hidden?'display:none':''}">`;
    cHtml+=`<div class="b-col-hdr">
      <div class="b-av ${b.id}">${b.name[0]}</div>
      <div><div class="b-nm">${b.name}</div><div class="b-cnt">${active.length} cita${active.length!==1?'s':''}</div></div>
    </div>`;
    cHtml+=`<div class="b-col-body" style="height:${totalPx}px;position:relative;overflow:visible">`;

    // Slot rows
    for(let s=0;s<rows;s++) {
      const sm=openM+s*SLOT_M, topPx=s*SLOT_H;
      const isOcc=occ.has(sm);
      const hrb=(s+1)%2===0?'':' hr-bound';
      const slH=fromMin(sm), slHF=fromMin(sm+SLOT_M);
      cHtml+=`<div class="srow${hrb}${isOcc?' occupied':''}" style="top:${topPx}px"${!isOcc?` onclick="openBlk('${b.id}','${ds()}','${slH}','${slHF}')"`:''} title="${slH}"></div>`;
    }

    // Block overlays (z-index:2)
    dayBlk.forEach(bl=>{
      let sP,hP;
      if(!bl.hora_inicio){sP=0;hP=totalPx;}
      else{const sm=toMin(bl.hora_inicio.slice(0,5)),em=toMin(bl.hora_fin.slice(0,5));sP=((sm-openM)/SLOT_M)*SLOT_H;hP=((em-sm)/SLOT_M)*SLOT_H;}
      if(sP<0||sP>=totalPx)return;
      _svcBlkMap[String(bl.id)] = bl;
      if(bl.tipo==='servicio'){
        const clienteLbl = bl.client_name || 'Sin cliente';
        const svcLbl = bl.svc_nom || 'Servicio';
        const hiLbl = (bl.hora_inicio||'').slice(0,5);
        const hfLbl = (bl.hora_fin||'').slice(0,5);
        const showSub = hP >= 44;
        const showTime = hP >= 58;
        cHtml+=`<div class="blk-overlay servicio" style="top:${sP}px;height:${hP}px" onclick="openSvcEdit(${bl.id})">
          <div class="blk-svc-row">
            <div class="blk-lbl">✂️ ${svcLbl}</div>
            <div class="blk-edit-btn" title="Editar">✏</div>
          </div>
          ${showSub?`<div class="blk-sub">${clienteLbl}</div>`:''}
          ${showTime?`<div class="blk-time-lbl">${hiLbl}–${hfLbl}</div>`:''}
        </div>`;
      } else {
        cHtml+=`<div class="blk-overlay" style="top:${sP}px;height:${hP}px"><div class="blk-lbl">🚫 ${bl.motivo||'Bloqueado'}</div></div>`;
      }
    });

    // Appointment cards (z-index:3)
    dayApts.forEach(a=>{
      const hi=(a.hora_inicio||a.hora||'00:00').slice(0,5);
      const hf=(a.hora_fin||fromMin(toMin(hi)+(a.duracion||30))).slice(0,5);
      const sm=toMin(hi),em=toMin(hf);
      const tP=((sm-openM)/SLOT_M)*SLOT_H;
      const hP=((em-sm)/SLOT_M)*SLOT_H;
      if(tP<0||tP>=totalPx)return;
      const short=hP<44;
      const estado=a.estado||'pendiente';
      cHtml+=`<div class="apt-card ${estado}" style="top:${tP+3}px;height:${Math.max(hP-6,24)}px" onclick="openApt('${a.id}')">
        <div class="apt-nm">${a.client_name||'Sin nombre'}</div>
        ${!short?`<div class="apt-svc">${a.svc_nom||a.service||''}</div>`:''}
        ${!short?`<div class="apt-hr">${hi}–${hf}</div>`:''}
      </div>`;
    });

    // Current-time line (z-index:5)
    if(nowPx!==null){
      cHtml+=`<div class="now-line" style="top:${nowPx}px"><div class="now-dot"></div><div class="now-bar"></div></div>`;
    }

    cHtml+='</div></div>'; // body + col
  });
  cHtml+='</div>';

  document.getElementById('calContent').innerHTML=`<div class="cal-daily">${tHtml}${cHtml}</div>`;
  setupSwipe();

  // Refresh now-line every minute when viewing today
  clearTimeout(nowTimer);
  if(isToday) nowTimer=setTimeout(renderDay,60000);
}

// Mobile swipe
let swipeX=0;
function setupSwipe() {
  const el=document.getElementById('bCols');
  if(!el)return;
  el.addEventListener('touchstart',e=>{swipeX=e.touches[0].clientX;},{passive:true});
  el.addEventListener('touchend',e=>{
    if(window.innerWidth>=768||filter!=='todos')return;
    const dx=e.changedTouches[0].clientX-swipeX;
    if(Math.abs(dx)<40)return;
    if(dx<0)mbNext();else mbPrev();
  },{passive:true});
}
function mbPrev() { mbIdx=(mbIdx-1+BARBERS.length)%BARBERS.length; renderDay(); }
function mbNext() { mbIdx=(mbIdx+1)%BARBERS.length; renderDay(); }

// ── WEEKLY VIEW ───────────────────────────────────────────────
function renderWeek() {
  document.getElementById('mobNav').style.display='none';
  const ws=weekStart(cur);
  const days=Array.from({length:6},(_,i)=>addD(ws,i));
  const todayStr=fmtD(new Date());
  const visBs=filter==='todos'?BARBERS:BARBERS.filter(b=>b.id===filter);
  const allApts=Object.values(weekData).flatMap(d=>d.a||[]);
  updateSum(allApts);

  let h='<div class="wk-wrap"><table class="wk-table"><thead><tr>';
  h+='<th class="wk-th" style="min-width:100px">Maestro</th>';
  days.forEach(d=>{
    const isT=fmtD(d)===todayStr, sc=sched(d);
    h+=`<th class="wk-th${isT?' today':''}">${DSHORT[d.getDay()].toUpperCase()}<br><span style="font-size:16px;font-weight:800">${d.getDate()}</span>${!sc?'<br><small style="opacity:.45;font-size:10px">Cerrado</small>':''}</th>`;
  });
  h+='</tr></thead><tbody>';

  visBs.forEach(b=>{
    h+=`<tr><td class="wk-blbl"><div style="display:flex;align-items:center;gap:8px"><div class="b-av ${b.id}" style="width:26px;height:26px;font-size:11px;border-radius:7px">${b.name[0]}</div>${b.name}</div></td>`;
    days.forEach(d=>{
      const ds2=fmtD(d), sc=sched(d), isT=ds2===todayStr;
      if(!sc){h+=`<td class="wk-cell closed${isT?' today':''}">—</td>`;return;}
      const data=weekData[ds2]||{a:[],b:[]};
      const da=(data.a||[]).filter(a=>a.bid===b.id&&a.estado!=='cancelado');
      const n=da.length;
      const rev=da.filter(a=>a.estado==='confirmado').reduce((s,a)=>s+(a.precio_base||a.precio||0),0);
      const load=n>=8?'heavy':n>=4?'med':n>0?'light':'none';
      h+=`<td class="wk-cell${isT?' today':''}" onclick="goDayB('${ds2}','${b.id}')">
        <div class="wk-load-bar"><div class="wk-load-fill ${load}"></div></div>
        <span class="wk-n">${n}</span>
        <div class="wk-rev">${rev?peso(rev):'—'}</div>
      </td>`;
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  document.getElementById('calContent').innerHTML=h;
}

function goDayB(ds2,bid) {
  const [y,m,d]=ds2.split('-').map(Number);
  cur=new Date(y,m-1,d);
  filter=bid; view='dia';
  document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('on',p.dataset.bid===bid));
  document.getElementById('vbDia').classList.add('on');
  document.getElementById('vbSemana').classList.remove('on');
  updateHdr(); refresh();
}

// ── APPOINTMENT MODAL ─────────────────────────────────────────
function openApt(id) {
  selApt=apts.find(a=>String(a.id)===String(id));
  if(!selApt)return;
  const a=selApt;
  const hi=(a.hora_inicio||a.hora||'—').slice(0,5);

  const est=a.estado||'pendiente';

  const aptFecha = (a.fecha||ds()).slice(0,10);
  const canCheckin = (est==='pendiente'||est==='confirmado') && aptFecha<=fmtD(new Date());
  document.getElementById('aptBody').innerHTML=`

      <div class="checkin-banner-info">

    <div class="mrow"><span class="mlbl">Teléfono</span><span class="mval">${a.client_phone||'—'}</span></div>
    <div class="mrow"><span class="mlbl">Email</span><span class="mval">${a.client_email||'—'}</span></div>
    <div class="mrow"><span class="mlbl">Servicio</span><span class="mval">${a.svc_nom||a.service||'—'}</span></div>
    <div class="mrow"><span class="mlbl">Maestro</span><span class="mval">${B_MAP[a.bid]||a.bid||'—'}</span></div>
    <div class="mrow"><span class="mlbl">Horario</span><span class="mval">${hi} – ${hf}</span></div>
    <div class="mrow"><span class="mlbl">Precio</span><span class="mval">${(a.precio_base||a.precio)?peso(a.precio_base||a.precio):'—'}</span></div>
    <div class="mrow"><span class="mlbl">Estado</span><span class="mval"><span class="ebadge ${est}">${est.toUpperCase()}</span></span></div>

  foot.innerHTML='';
  const add=(lbl,cls,fn)=>{const b=document.createElement('button');b.className='btn '+cls;b.innerHTML=lbl;b.onclick=fn;foot.appendChild(b);};

  if(est==='pendiente') add('✓ CONFIRMAR','b-ok',()=>patchEst(a.id,'confirmado'));
  if((est==='pendiente'||est==='confirmado') && aptFecha<=fmtD(new Date()))
    add('🪑 PASAR A COLA','b-ok',()=>checkInFromApt(a.id));
  if(est!=='cancelado'&&est!=='completado') {
    add('✏ EDITAR','b-ghost',()=>openEdit(a.id));
    add('↕ REASIGNAR','b-ghost',()=>{closeOv('aptOv');openRas(a.id,a.bid);});
    add('✕ CANCELAR','b-err',()=>{if(confirm('¿Cancelar esta cita?'))patchEst(a.id,'cancelado');});
  }
  if(a.client_phone) {

async function patchEst(id, estado) {
  try {
    let r;
    if(estado==='confirmado') r=await fetch(`${API}/appointments/${id}/confirm`,{method:'PUT',headers:{'Content-Type':'application/json'}});
    else if(estado==='cancelado') r=await fetch(`${API}/appointments/${id}/cancel`,{method:'PUT',headers:{'Content-Type':'application/json'}});
    else r=await fetch(`${API}/appointments/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({estado})});
    if(!r.ok && (r.status===404||r.status===405)) {
      r=await fetch(`${API}/appointments/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({estado})});
    }
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    closeOv('aptOv');
    showToast(estado==='confirmado'?'Cita confirmada ✓':'Cita cancelada','ok');
    refresh();
  } catch(e){ showToast('Error: '+e.message,'err'); }
}

// ── CHECK-IN FROM AGENDA ──────────────────────────────────────
async function checkInFromApt(aptId) {
  const a = apts.find(a=>String(a.id)===String(aptId));
  if (!a) return;
  const btn = document.getElementById('chkInBtn');
  if (btn) { btn.disabled=true; btn.textContent='⏳ Procesando…'; }
  try {
    const r = await fetch(`${API}/queue/checkin`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        client_name: a.client_name || 'Cliente',
        phone: a.client_phone || null,
        barber_id: BID_TO_QID[a.bid] || a.bid,
        service: a.svc_nom || a.service || 'Corte',
        drink: null
      })
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    // Mark appointment as en_curso (non-blocking)
    fetch(`${API}/appointments/${aptId}`, {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({estado:'en_curso'})
    }).catch(()=>{});
    closeOv('aptOv');
    showToast(`${a.client_name||'Cliente'} ingresó a la cola ✓`, 'ok');
    refresh();
    if (IS_EMBEDDED) setTimeout(irACola, 900);
  } catch(e) {
    if (btn) { btn.disabled=false; btn.textContent='▶ LLEGÓ'; }
    showToast('Error al hacer check-in: '+e.message, 'err');
  }
}

// ── REASSIGN MODAL ────────────────────────────────────────────
function openRas(aptId, curBid) {
  rasId=aptId; rasNewBid=null;
  document.getElementById('rasBtn').disabled=true;
  document.getElementById('rasPick').innerHTML=BARBERS.map(b=>
    `<div class="bpick-btn${b.id===curBid?' on':''}" data-bid="${b.id}" onclick="pickRas('${b.id}')">
      <div class="b-av ${b.id}" style="width:28px;height:28px;font-size:11px;margin:0 auto 6px;border-radius:8px">${b.name[0]}</div>
      ${b.name}${b.id===curBid?' <small style="opacity:.55">(actual)</small>':''}
    </div>`
  ).join('');
  document.getElementById('rasOv').classList.add('on');
}
function pickRas(bid) {
  rasNewBid=bid;
  document.querySelectorAll('#rasPick .bpick-btn').forEach(b=>b.classList.toggle('on',b.dataset.bid===bid));
  document.getElementById('rasBtn').disabled=false;
}
async function doReassign() {
  if(!rasId||!rasNewBid)return;
  try {
    let r=await fetch(`${API}/appointments/${rasId}/reassign`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({new_barbero_id:rasNewBid})});
    if(!r.ok&&(r.status===404||r.status===405)) {
      r=await fetch(`${API}/appointments/${rasId}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({bid:rasNewBid})});
    }
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    closeOv('rasOv');
    showToast('Reasignado a '+B_MAP[rasNewBid],'ok');
    refresh();
  } catch(e){ showToast('Error: '+e.message,'err'); }
}

// ── BLOCK / SERVICE SLOT MODAL ────────────────────────────────
let _blkTipo = 'block';
let _editBlkId = null;
let _svcBlkMap = {};

function setBlkTipo(tipo) {
  _blkTipo = tipo;
  document.getElementById('bkTipoBloq').classList.toggle('active', tipo==='block');
  document.getElementById('bkTipoSvc').classList.toggle('active', tipo==='servicio');
  document.getElementById('bkBlockFields').style.display = tipo==='block' ? '' : 'none';
  document.getElementById('bkSvcFields').style.display   = tipo==='servicio' ? '' : 'none';
  document.getElementById('blkTitle').textContent = tipo==='servicio' ? 'Reservar Servicio' : 'Nuevo Bloqueo';
  document.getElementById('blkSubmitBtn').textContent = tipo==='servicio' ? 'GUARDAR SERVICIO' : 'BLOQUEAR';
  document.getElementById('blkSubmitBtn').className   = tipo==='servicio' ? 'btn b-purple' : 'btn b-err';
}

function openBlk(bid, dateStr, hi, hf) {
  _editBlkId = null;
  document.getElementById('bkBid').innerHTML=BARBERS.map(b=>`<option value="${b.id}"${b.id===bid?' selected':''}>${b.name}</option>`).join('');
  document.getElementById('bkFecha').value=dateStr;
  document.getElementById('bkIni').value=hi;
  document.getElementById('bkFin').value=hf;
  document.getElementById('bkFull').checked=false;
  document.getElementById('bkIni').disabled=false;
  document.getElementById('bkFin').disabled=false;
  document.getElementById('bkCliente').value='';
  document.getElementById('blkDeleteBtn').style.display='none';
  document.getElementById('blkTipoRow').style.display='';
  setBlkTipo('block');
  document.getElementById('blkOv').classList.add('on');
}

function openSvcEdit(id) {
  const bl = _svcBlkMap[String(id)];
  if (!bl) { showToast('No se pudo cargar el servicio','err'); return; }
  _editBlkId = id;
  document.getElementById('bkBid').innerHTML=BARBERS.map(b=>`<option value="${b.id}"${b.id===bl.bid?' selected':''}>${b.name}</option>`).join('');
  document.getElementById('bkFecha').value=(bl.fecha||'').slice(0,10);
  document.getElementById('bkIni').value=(bl.hora_inicio||'').slice(0,5);
  document.getElementById('bkFin').value=(bl.hora_fin||'').slice(0,5);
  document.getElementById('bkIni').disabled=false;
  document.getElementById('bkFin').disabled=false;
  document.getElementById('bkFull').checked=false;
  document.getElementById('bkCliente').value=bl.client_name||'';
  setBlkTipo('servicio');
  const svcEl=document.getElementById('bkSvc');
  if(svcEl) svcEl.value=bl.svc_nom||'Corte';
  document.getElementById('blkTipoRow').style.display='none';
  document.getElementById('blkTitle').textContent='Editar Servicio';
  document.getElementById('blkSubmitBtn').textContent='GUARDAR CAMBIOS';
  document.getElementById('blkSubmitBtn').className='btn b-purple';
  document.getElementById('blkDeleteBtn').style.display='';
  document.getElementById('blkOv').classList.add('on');
}

async function deleteBlkEntry() {
  if (!_editBlkId) return;
  if (!confirm('¿Eliminar este servicio del horario? Esta acción no se puede deshacer.')) return;
  try {
    const r=await fetch(`${API}/blocked-slots/${_editBlkId}`,{method:'DELETE'});
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    closeOv('blkOv');
    showToast('Servicio eliminado','ok');
    _editBlkId=null;
    refresh();
  } catch(e){ showToast('Error: '+e.message,'err'); }
}

function toggleFull() {
  const chk=document.getElementById('bkFull').checked;
  const fd=document.getElementById('bkFecha').value;
  const sc=fd?sched(new Date(fd+'T12:00:00')):null;
  document.getElementById('bkIni').value=chk?(sc?.o||'10:00'):''; document.getElementById('bkIni').disabled=chk;
  document.getElementById('bkFin').value=chk?(sc?.c||'20:00'):''; document.getElementById('bkFin').disabled=chk;
}

async function submitBlock() {
  const bid=document.getElementById('bkBid').value;
  const fecha=document.getElementById('bkFecha').value;
  const hi=document.getElementById('bkIni').value;
  const hf=document.getElementById('bkFin').value;
  if(!fecha||!hi||!hf){showToast('Completa todos los campos','err');return;}
  if(toMin(hi)>=toMin(hf)){showToast('La hora fin debe ser posterior al inicio','err');return;}
  const body = _blkTipo==='servicio'
    ? { bid, fecha, hora_inicio:hi, hora_fin:hf, tipo:'servicio',
        svc_nom: document.getElementById('bkSvc').value,
        client_name: document.getElementById('bkCliente').value.trim()||null }
    : { bid, fecha, hora_inicio:hi, hora_fin:hf, tipo:'block',
        motivo: document.getElementById('bkMotivo').value };
  try {
    const url=_editBlkId?`${API}/blocked-slots/${_editBlkId}`:`${API}/blocked-slots`;
    const method=_editBlkId?'PATCH':'POST';
    const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    closeOv('blkOv');
    const msg=_editBlkId?'Cambios guardados ✓':(_blkTipo==='servicio'?'Servicio reservado ✂️':'Horario bloqueado');
    _editBlkId=null;
    showToast(msg,'ok');
    refresh();
  } catch(e){ showToast('Error: '+e.message,'err'); }
}

// ── EDIT (RESCHEDULE) MODAL ───────────────────────────────────
let editId=null, editDur=30;

function openEdit(id) {
  const a=apts.find(a=>String(a.id)===String(id));
  if(!a)return;
  editId=id; editDur=a.duracion||30;
  const hi=(a.hora_inicio||a.hora||'09:00').slice(0,5);
  document.getElementById('edFecha').value=a.fecha||ds();
  document.getElementById('edHI').value=hi;
  document.getElementById('edNotas').value=a.notas||'';
  edUpdHf();
  closeOv('aptOv');
  document.getElementById('editOv').classList.add('on');
}

function edUpdHf() {
  const hi=document.getElementById('edHI').value;
  document.getElementById('edHF').value=hi?fromMin(toMin(hi)+editDur):'';
}

async function submitEdit() {
  const fecha=document.getElementById('edFecha').value;
  const hora_inicio=document.getElementById('edHI').value;
  const notas=document.getElementById('edNotas').value||null;
  if(!fecha||!hora_inicio){showToast('Completa fecha y hora de inicio','err');return;}
  try {
    const r=await fetch(`${API}/appointments/${editId}`,{
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({fecha,hora_inicio,notas})
    });
    const j=await r.json();
    if(!r.ok){
      showToast(j.error==='conflicto_horario'?'Ese horario ya está ocupado — elige otro':'Error: '+(j.error||r.status),'err');
      return;
    }
    closeOv('editOv');
    showToast('Cita reagendada ✓','ok');
    const [y,m,d]=fecha.split('-').map(Number);
    cur=new Date(y,m-1,d); updateHdr(); refresh();
  } catch(e){ showToast('Error: '+e.message,'err'); }
}

// ── Modal helper ──────────────────────────────────────────────
function closeOv(id){ document.getElementById(id).classList.remove('on'); }

// ── INIT ──────────────────────────────────────────────────────
updateHdr();
refresh();
window.addEventListener('resize',()=>{ clearTimeout(window._rt); window._rt=setTimeout(renderView,150); });
</script>
